<!doctype html>
<!--
  Side-by-side 3D comparison of experiment runs (pre-processing variants).
  Serve the playground folder, then open this page:
    cd playground && python3 -m http.server 8000
    http://localhost:8000/experiments/compare.html?set=tab-south-0s-20s
  Both views share one camera: orbit / zoom in either, the other follows.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Experiment comparison</title>
<style>
  html, body { margin: 0; height: 100%; background: #10141a; color: #dde3ea; font: 13px system-ui, sans-serif; }
  main { display: grid; grid-template-columns: 1fr 1fr; height: 100%; gap: 2px; }
  section { position: relative; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
  .bar { position: absolute; top: 8px; left: 8px; right: 8px; display: flex; gap: 8px; align-items: flex-start; }
  select { font: inherit; background: #1c2430; color: inherit; border: 1px solid #334; padding: 4px; }
  table { background: #1c2430cc; border-collapse: collapse; }
  td { padding: 1px 6px; }
  td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
  img { position: absolute; bottom: 8px; left: 8px; width: 22%; border: 1px solid #334; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<main>
  <section id="a"><canvas></canvas><div class="bar"><select></select><table></table></div><img alt="input frame"></section>
  <section id="b"><canvas></canvas><div class="bar"><select></select><table></table></div><img alt="input frame"></section>
</main>
<script type="module">
import * as THREE from 'three'
import { OrbitControls } from 'three/addons/controls/OrbitControls.js'
import { PLYLoader } from 'three/addons/loaders/PLYLoader.js'

const set = new URLSearchParams(location.search).get('set') ?? 'tab-south-0s-20s'
const base = `../out/experiments/${set}`
const runs = await (await fetch(`${base}/index.json`)).json()
const camera = new THREE.PerspectiveCamera(50, 1, 0.001, 100)
const views = ['a', 'b'].map((id, i) => {
  const el = document.getElementById(id)
  const renderer = new THREE.WebGLRenderer({ canvas: el.querySelector('canvas'), antialias: true })
  const scene = new THREE.Scene()
  scene.background = new THREE.Color(0x10141a)
  const controls = new OrbitControls(camera, renderer.domElement)
  const select = el.querySelector('select')
  for (const r of runs) select.add(new Option(r.name, r.name))
  select.value = runs[Math.min(i, runs.length - 1)].name
  const view = { el, renderer, scene, controls, select, points: null }
  select.onchange = () => load(view)
  return view
})
// One camera, two controls: keep their targets in sync.
for (const v of views) v.controls.addEventListener('change', () => {
  for (const o of views) if (o !== v) o.controls.target.copy(v.controls.target)
})

const fmt = (k, x) => typeof x !== 'number' ? String(x)
  : ['confident', 'kept', 'recovered', 'depthError2', 'depthError8'].includes(k) ? (x * 100).toFixed(1) + ' %'
  : Number.isInteger(x) ? x.toLocaleString('en') : x.toFixed(3)

let framed = false
async function load(view) {
  const run = runs.find((r) => r.name === view.select.value)
  view.el.querySelector('table').innerHTML = Object.entries(run)
    .filter(([k]) => !['name', 'variant'].includes(k))
    .map(([k, x]) => `<tr><td>${k}</td><td>${fmt(k, x)}</td></tr>`).join('')
  view.el.querySelector('img').src = `${base}/${run.name}/sample.jpg`
  const geom = await new PLYLoader().loadAsync(`${base}/${run.name}/web/cloud.ply`)
  // OpenCV camera frame (y down, z forward) -> three.js (y up, z backward).
  geom.scale(1, -1, -1)
  if (view.points) { view.scene.remove(view.points); view.points.geometry.dispose() }
  geom.computeBoundingSphere()
  const r = geom.boundingSphere.radius
  view.points = new THREE.Points(geom, new THREE.PointsMaterial({ size: r / 400, vertexColors: true }))
  view.scene.add(view.points)
  if (!framed) {
    framed = true
    const c = geom.boundingSphere.center
    camera.position.set(c.x, c.y + r * 1.2, c.z + r * 0.8)
    for (const v of views) { v.controls.target.copy(c); v.controls.update() }
  }
}

await Promise.all(views.map(load))
function frame() {
  for (const v of views) {
    const { clientWidth: w, clientHeight: h } = v.el
    if (v.renderer.domElement.width !== w * devicePixelRatio) { v.renderer.setPixelRatio(devicePixelRatio); v.renderer.setSize(w, h, false) }
    camera.aspect = w / h
    camera.updateProjectionMatrix()
    v.renderer.render(v.scene, camera)
  }
  requestAnimationFrame(frame)
}
frame()
</script>
</body>
</html>
