server {
    listen 80;
    root /usr/share/nginx/html;

    # Compress text and the binary point clouds (.ply) on the fly.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/octet-stream;

    # Hashed build assets never change.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback for vue-router history mode. No `$uri/`: the route
    # /transects/<key> shares its path with the data folder public/transects/<key>/.
    location / {
        try_files $uri /index.html;
    }
}
