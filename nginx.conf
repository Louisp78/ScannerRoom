server {
    listen 80;
    root /usr/share/nginx/html;

    # Compress text and the binary point clouds (.ply) on the fly.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/octet-stream;

    # Docker's embedded DNS: the API container is resolved per request, so this
    # container starts (and serves the landing page) even when the API is down.
    resolver 127.0.0.11 valid=30s;
    set $api http://scannerroom-api:3002;

    # Hashed build assets never change.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The API (US-4.1), on the same origin so the session cookie needs no CORS.
    # X-Forwarded-Proto set by Cloudflare passes through untouched.
    location /api/ {
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Transect data files (point cloud, path, video...) are reserved to signed-in
    # users, except showcase transects (US-4.2): the API decides for each request.
    # The SPA route /transects/<key> itself has no further segment and falls
    # through to the SPA block below.
    # The key is captured from the normalised $uri (dot segments resolved,
    # percent-decoded), i.e. the folder try_files actually serves from. Never
    # derive it from $request_uri: /transects/<showcase>/../<private>/... would
    # be checked as the showcase while serving the private file.
    location ~ ^/transects/(?<transect_key>[^/]+)/. {
        auth_request /_auth;
        # Never stored by Cloudflare or any shared cache: an edge copy would be
        # served to everyone, bypassing the check.
        add_header Cache-Control "private, no-store" always;
        try_files $uri =404;
    }

    location = /_auth {
        internal;
        proxy_pass $api/api/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        # Variables are shared with the main request, so this is its capture.
        proxy_set_header X-Transect-Key $transect_key;
    }

    # SPA fallback for vue-router history mode. No `$uri/`: the route
    # /transects/<key> shares its path with the data folder public/transects/<key>/.
    location / {
        try_files $uri /index.html;
    }
}
